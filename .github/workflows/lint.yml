name: Lint

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  # release.yml calls this as a reusable workflow (`uses: ./.github/workflows/lint.yml`).
  # Without workflow_call the call is invalid and every `v*` tag push fails the
  # Release workflow at startup, in 0s, before a single step runs.
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: uv sync --group dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check linting
        run: uv run ruff check .
